
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TEMPLATE</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 60, 110, 0.10),
                    transparent 55%
                ),
                #0d090d;

            color: white;

            font-family: Arial, sans-serif;

            overflow: hidden;

        }


        /* =================================================
           INTRO
        ================================================= */

        .intro {

            text-align: center;

            transition:
                opacity 1s ease,
                transform 1s ease;

        }


        .heart {
            width: clamp(
                180px,
                30vw,
                350px
            );

            height: auto;

            display: inline-block;

            animation:
                heartbeat 1.2s ease-in-out infinite;

            filter:
                drop-shadow(
                    0 0 25px
                    rgba(255, 60, 110, 0.35)
                );
        }


        .date {

            margin-top: 30px;

            font-size: 1.15rem;

            letter-spacing: 1px;

            color: #ffdce5;

            opacity: 0;

            animation:
                textFadeIn 1.5s ease 0.8s forwards;

        }


        /* =================================================
           LOXX SECURITY SCREEN
        ================================================= */

        .security {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            opacity: 0;

            pointer-events: none;

        }


        .lock {
            width: clamp(220px, 35vw, 500px);
            height: auto;

            display: block;

            transform:
                translateY(-120vh)
                rotate(-8deg);

            filter:
                drop-shadow(
                    0 0 30px
                    rgba(255, 255, 255, 0.15)
                );
        }


        .security-text {

            margin-top: 25px;

            font-size: clamp(1rem, 3vw, 1.5rem);

            letter-spacing: 3px;

            color: #ff9fba;

            opacity: 0;

            transform: translateY(15px);

        }


        /* =================================================
           ANIMATIONS
        ================================================= */

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.12);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.12);
            }

            60% {
                transform: scale(1);
            }

        }


        @keyframes textFadeIn {

            from {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {
                opacity: 0.75;

                transform:
                    translateY(0);
            }

        }


        @keyframes lockSlam {

            0% {

                transform:
                    translateY(-120vh)
                    rotate(-8deg);

            }

            70% {

                transform:
                    translateY(20px)
                    rotate(2deg);

            }

            82% {

                transform:
                    translateY(-10px)
                    rotate(-1deg);

            }

            92% {

                transform:
                    translateY(4px)
                    rotate(0deg);

            }

            100% {

                transform:
                    translateY(0)
                    rotate(0deg);

            }

        }


        @keyframes securityText {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =================================================
           IMMEDIATE SCREEN SHAKE
        ================================================= */

        @keyframes screenShake {

            0% {
                transform: translate(0, 0);
            }

            10% {
                transform: translate(-12px, 7px);
            }

            20% {
                transform: translate(10px, -8px);
            }

            30% {
                transform: translate(-9px, -5px);
            }

            40% {
                transform: translate(8px, 6px);
            }

            50% {
                transform: translate(-6px, 4px);
            }

            60% {
                transform: translate(5px, -4px);
            }

            70% {
                transform: translate(-4px, 3px);
            }

            80% {
                transform: translate(3px, -2px);
            }

            90% {
                transform: translate(-2px, 1px);
            }

            100% {
                transform: translate(0, 0);
            }

        }


        @keyframes securityGlow {

            0%,
            100% {

                filter:
                    drop-shadow(
                        0 0 20px
                        rgba(255, 100, 140, 0.2)
                    );

            }

            50% {

                filter:
                    drop-shadow(
                        0 0 60px
                        rgba(255, 100, 140, 0.65)
                    );

            }

        }


        @keyframes finalFade {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }

        }


        /* =================================================
           STATES
        ================================================= */

        .show-security {

            opacity: 1;

        }


        .show-lock {

            animation:
                lockSlam 0.8s cubic-bezier(
                    0.2,
                    1.4,
                    0.4,
                    1
                ) forwards,
                securityGlow 2s ease-in-out 0.8s infinite;

        }


        .show-security-text {

            animation:
                securityText 0.8s ease forwards;

        }


        .shake {

            animation:
                screenShake 0.55s ease;

        }


        .fade-away {

            animation:
                finalFade 1s ease forwards;

        }

    </style>

</head>


<body>


    <!-- ================================================
         INTRO
    ================================================= -->

    <main class="intro" id="intro">

        <img
            class="heart"
            id="heart"
            src="HEART.svg"
            alt=""
        >

        <p class="date">
            August 9th 2026 — the day we got together
        </p>

    </main>


    <!-- ================================================
         LOXX SECURITY
    ================================================= -->

    <section class="security" id="security">

        <img
            class="lock"
            id="lock"
            src="LOXX.svg"
            alt=""
        >

        <p
            class="security-text"
            id="securityText"
        >
            Secured By LOXX ♥
        </p>

    </section>


    <script>

        const intro =
            document.getElementById("intro");

        const security =
            document.getElementById("security");

        const lock =
            document.getElementById("lock");

        const securityText =
            document.getElementById("securityText");


        /*
            Wait for the heart intro
        */

        setTimeout(() => {

            intro.style.opacity = "0";

            intro.style.transform =
                "scale(0.95)";

        }, 4000);


        /*
            Show LOXX security screen
        */

        setTimeout(() => {

            intro.style.display = "none";

            security.classList.add(
                "show-security"
            );


            /*
                Start the lock AND screen shake
                at exactly the same time.
            */

            lock.classList.add(
                "show-lock"
            );

            document.body.classList.add(
                "shake"
            );


            /*
                Security text
            */

            setTimeout(() => {

                securityText.classList.add(
                    "show-security-text"
                );

            }, 700);

        }, 5000);


        /*
            Leave intro
        */

        setTimeout(() => {

            security.classList.add(
                "fade-away"
            );


            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 1000);

        }, 8000);

    </script>


</body>

</html>
