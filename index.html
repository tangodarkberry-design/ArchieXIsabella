<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secured By LOXX</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            overflow: hidden;

            background: #070508;

            color: white;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        /* =========================================
           BACKGROUND
        ========================================= */

        .background {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(
                        255,
                        40,
                        100,
                        0.10
                    ),
                    transparent 38%
                ),
                #070508;

            z-index: 0;

        }


        .background::after {

            content: "";

            position: absolute;

            inset: -50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        255,
                        50,
                        110,
                        0.08
                    ),
                    transparent 55%
                );

            animation:
                ambientGlow
                5s
                ease-in-out
                infinite;

        }


        /* =========================================
           SCANLINES
        ========================================= */

        .scanlines {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 50;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(
                        255,
                        255,
                        255,
                        0.015
                    ) 0px,
                    rgba(
                        255,
                        255,
                        255,
                        0.015
                    ) 1px,
                    transparent 1px,
                    transparent 4px
                );

        }


        /* =========================================
           SCREENS
        ========================================= */

        .screen {

            position: fixed;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            z-index: 2;

        }


        .screen.active {

            opacity: 1;

            visibility: visible;

        }


        /* =========================================
           HEARTBEAT
        ========================================= */

        .heartbeat {

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        .heart-container {

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .heart-glow {

            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(
                        255,
                        40,
                        100,
                        0.20
                    ),
                    transparent 65%
                );

            filter: blur(25px);

            animation:
                heartGlow
                1.2s
                ease-in-out
                infinite;

        }


        .heart {

            position: relative;

            width: clamp(
                180px,
                30vw,
                350px
            );

            height: auto;

            filter:
                drop-shadow(
                    0 0 20px
                    rgba(
                        255,
                        50,
                        110,
                        0.35
                    )
                );

            animation:
                heartbeat
                1.2s
                ease-in-out
                infinite;

        }


        .date {

            margin-top: 30px;

            font-size:
                clamp(
                    0.8rem,
                    2vw,
                    1.05rem
                );

            letter-spacing: 3px;

            color:
                rgba(
                    255,
                    220,
                    230,
                    0.75
                );

            opacity: 0;

            animation:
                dateAppear
                1s
                ease
                0.7s
                forwards;

        }


        /* =========================================
           LOXX
        ========================================= */

        .loxx-screen {

            background:
                radial-gradient(
                    circle at center,
                    rgba(
                        255,
                        40,
                        100,
                        0.08
                    ),
                    transparent 45%
                );

        }


        .loxx-container {

            position: relative;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

        }


        .loxx-ring {

            position: absolute;

            width: 430px;
            height: 430px;

            max-width: 75vw;
            max-height: 75vw;

            border-radius: 50%;

            border:
                1px solid
                rgba(
                    255,
                    80,
                    130,
                    0.12
                );

            opacity: 0;

            animation:
                ringAppear
                0.8s
                ease
                0.7s
                forwards;

        }


        .loxx-ring::after {

            content: "";

            position: absolute;

            inset: 20px;

            border-radius: 50%;

            border:
                1px dashed
                rgba(
                    255,
                    100,
                    150,
                    0.12
                );

            animation:
                rotateRing
                12s
                linear
                infinite;

        }


        .lock {

            position: relative;

            z-index: 2;

            width: clamp(
                220px,
                35vw,
                500px
            );

            height: auto;

            transform:
                translateY(-120vh)
                rotate(-8deg)
                scale(0.9);

        }


        .lock.slam {

            animation:
                lockSlam
                0.85s
                cubic-bezier(
                    0.16,
                    1.3,
                    0.3,
                    1
                )
                forwards,

                lockGlow
                2.5s
                ease-in-out
                0.85s
                infinite;

        }


        .security {

            position: relative;

            z-index: 3;

            text-align: center;

            margin-top: 22px;

            opacity: 0;

            transform:
                translateY(15px);

        }


        .security.show {

            animation:
                textAppear
                0.8s
                ease
                forwards;

        }


        .security-small {

            font-size: 0.6rem;

            letter-spacing: 5px;

            text-transform: uppercase;

            color:
                rgba(
                    255,
                    160,
                    185,
                    0.45
                );

            margin-bottom: 10px;

        }


        .security-main {

            font-size:
                clamp(
                    1rem,
                    3vw,
                    1.4rem
                );

            letter-spacing: 5px;

            color: #ffb0c5;

            text-shadow:
                0 0 12px
                rgba(
                    255,
                    70,
                    120,
                    0.4
                );

        }


        /* =========================================
           EXIT
        ========================================= */

        .fade {

            animation:
                fadeOut
                1s
                ease
                forwards;

        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes heartbeat {

            0%,
            100% {
                transform:
                    scale(1);
            }

            15% {
                transform:
                    scale(1.10);
            }

            30% {
                transform:
                    scale(1);
            }

            45% {
                transform:
                    scale(1.10);
            }

            60% {
                transform:
                    scale(1);
            }

        }


        @keyframes heartGlow {

            0%,
            100% {

                transform:
                    scale(0.8);

                opacity: 0.4;

            }

            50% {

                transform:
                    scale(1.15);

                opacity: 0.9;

            }

        }


        @keyframes dateAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 0.75;

                transform:
                    translateY(0);

            }

        }


        @keyframes ambientGlow {

            0%,
            100% {

                transform:
                    scale(0.8);

                opacity: 0.5;

            }

            50% {

                transform:
                    scale(1.1);

                opacity: 1;

            }

        }


        @keyframes lockSlam {

            0% {

                transform:
                    translateY(-120vh)
                    rotate(-8deg)
                    scale(0.9);

            }

            65% {

                transform:
                    translateY(25px)
                    rotate(2deg)
                    scale(1.03);

            }

            78% {

                transform:
                    translateY(-10px)
                    rotate(-1deg)
                    scale(1);

            }

            90% {

                transform:
                    translateY(4px)
                    rotate(0deg)
                    scale(1);

            }

            100% {

                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(1);

            }

        }


        @keyframes lockGlow {

            0%,
            100% {

                filter:
                    drop-shadow(
                        0 0 20px
                        rgba(
                            255,
                            70,
                            130,
                            0.2
                        )
                    );

            }

            50% {

                filter:
                    drop-shadow(
                        0 0 65px
                        rgba(
                            255,
                            70,
                            130,
                            0.65
                        )
                    );

            }

        }


        @keyframes ringAppear {

            from {

                opacity: 0;

                transform:
                    scale(0.7);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        @keyframes rotateRing {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        @keyframes textAppear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes fadeOut {

            from {

                opacity: 1;

                transform:
                    scale(1);

            }

            to {

                opacity: 0;

                transform:
                    scale(1.04);

            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background"></div>

    <div class="scanlines"></div>


    <!-- =========================================
         HEARTBEAT
    ========================================= -->

    <section
        class="screen heartbeat active"
        id="heartbeat"
    >

        <div class="heart-container">

            <div class="heart-glow"></div>

            <img
                class="heart"
                src="HEART.svg"
                alt=""
            >

        </div>

        <p class="date">

            August 9th 2026
            —
            the day we got together

        </p>

    </section>


    <!-- =========================================
         LOXX
    ========================================= -->

    <section
        class="screen loxx-screen"
        id="loxxScreen"
    >

        <div class="loxx-container">

            <div class="loxx-ring"></div>

            <img
                class="lock"
                id="lock"
                src="LOXX.svg"
                alt=""
            >

            <div
                class="security"
                id="security"
            >

                <p class="security-small">

                    LOXX Security System

                </p>

                <p class="security-main">

                    Secured By LOXX ♥

                </p>

            </div>

        </div>

    </section>


    <script>

        const heartbeat =
            document.getElementById(
                "heartbeat"
            );

        const loxxScreen =
            document.getElementById(
                "loxxScreen"
            );

        const lock =
            document.getElementById(
                "lock"
            );

        const security =
            document.getElementById(
                "security"
            );


        /*
         * =====================================
         * 1. HEARTBEAT
         * =====================================
         *
         * Heart stays completely alone
         * for 4 seconds.
         */

        setTimeout(() => {

            /*
             * Fade heartbeat out.
             */

            heartbeat.classList.add(
                "fade"
            );

        }, 4000);


        /*
         * =====================================
         * 2. REMOVE HEARTBEAT
         * =====================================
         *
         * Wait until the fade has completely
         * finished before LOXX exists visually.
         */

        setTimeout(() => {

            heartbeat.classList.remove(
                "active"
            );

            heartbeat.classList.remove(
                "fade"
            );


            /*
             * NOW show LOXX.
             */

            loxxScreen.classList.add(
                "active"
            );


            /*
             * Small delay so the LOXX screen
             * itself is visible before the
             * lock falls in.
             */

            setTimeout(() => {

                lock.classList.add(
                    "slam"
                );

            }, 100);

        }, 5000);


        /*
         * =====================================
         * 3. SECURITY TEXT
         * =====================================
         *
         * Appears after the lock has landed.
         */

        setTimeout(() => {

            security.classList.add(
                "show"
            );

        }, 5850);


        /*
         * =====================================
         * 4. GO HOME
         * =====================================
         */

        setTimeout(() => {

            loxxScreen.classList.add(
                "fade"
            );

        }, 7500);


        setTimeout(() => {

            fetch("home.html")
                .then(response => response.text())
                .then(html => {
                    document.open();
                    document.write(html);
                    document.close();
                });

        }, 8500);

    </script>

</body>

</html>
